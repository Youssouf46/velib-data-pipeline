services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"

    volumes:                                   
      - kafka_data:/var/lib/kafka/data

    environment:
      # --- Identité : ce conteneur est à la fois broker et controller (mode KRaft, sans Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Réseau : 2 "portes d'entrée" (listeners)
      #   INTERNAL : pour les autres conteneurs (Spark, Kafka UI) -> kafka:29092
      #   EXTERNAL : pour ton PC Windows (ton script Python)     -> localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Un seul broker, donc pas de réplication possible
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data    

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10



  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: velib-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  producer:
    build: ./producer
    container_name: velib-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: velib-station-status
      POLL_INTERVAL_SECONDS: 60
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  
  spark-master:
    image: apache/spark:4.0.4-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"   # Spark UI du cluster (8080 sera pris par Airflow)
      - "4040:4040"   # Spark UI de l'application en cours
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-worker:
    image: apache/spark:4.0.4-python3
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./data:/opt/spark/data
    depends_on:
      - spark-master


volumes:                                       
  kafka_data: