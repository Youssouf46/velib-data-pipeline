x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Airflow 3 : les tâches parlent à l'API server (et plus directement à la base)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Chemin du projet sur Windows : utilisé pour monter data/ et spark_jobs/ dans les conteneurs Spark
    VELIB_HOST_DIR: ${VELIB_HOST_DIR}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock   # Airflow peut lancer des conteneurs (DockerOperator)



services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"

    volumes:                                   
      - kafka_data:/var/lib/kafka/data

    environment:
      # --- Identité : ce conteneur est à la fois broker et controller (mode KRaft, sans Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Réseau : 2 "portes d'entrée" (listeners)
      #   INTERNAL : pour les autres conteneurs (Spark, Kafka UI) -> kafka:29092
      #   EXTERNAL : pour ton PC Windows (ton script Python)     -> localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Un seul broker, donc pas de réplication possible
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data    

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10



  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: velib-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  producer:
    build: ./producer
    container_name: velib-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: velib-station-status
      POLL_INTERVAL_SECONDS: 60
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  
  spark-master:
    image: apache/spark:4.0.4-python3
    container_name: spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"   # Spark UI du cluster (8080 sera pris par Airflow)
      - "4040:4040"   # Spark UI de l'application en cours
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-worker:
    image: apache/spark:4.0.4-python3
    container_name: spark-worker
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./data:/opt/spark/data
    depends_on:
      - spark-master
  
  spark-bronze-stream:
    image: apache/spark:4.0.4-python3
    container_name: spark-bronze-stream
    command: ["/opt/spark/bin/spark-submit", "--conf", "spark.cores.max=1", "/opt/spark/jobs/stream_bronze.py"]
    ports:
      - "4041:4040"   # Spark UI du streaming (onglet Structured Streaming)
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"         # crée / met à jour les tables
      _AIRFLOW_WWW_USER_CREATE: "true"    # crée le compte admin
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-postgres:
        condition: service_healthy
  
    
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully


volumes:                                       
  kafka_data:
  airflow_pg_data: